<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.summary | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}">Of the Waters</a>
  <nav aria-label="Sections">
    <a href="{{ '/episodes/' | relative_url }}"{% if page.url contains '/episodes/' %} aria-current="page"{% endif %}>Episodes</a>
    <a href="{{ '/starmap/' | relative_url }}">Starmap</a>
    <a href="{{ '/chronology/' | relative_url }}">Chronology</a>
    <a href="{{ '/world-classes/' | relative_url }}">World classes</a>
  </nav>
</div></header>
<main class="wrap">
{{ content }}
</main>
<footer><div class="wrap">Campaign content <a href="https://creativecommons.org/licenses/by-nc/4.0/" rel="license" style="color:inherit">CC BY-NC 4.0</a> · code MIT · Mothership is a trademark of Tuesday Knight Games; this is an unofficial fan campaign. World types after the Orion's Arm NoLWoCS. <a href="{{ '/credits/' | relative_url }}" style="color:inherit">Credits</a></div></footer>
</body>
</html>
